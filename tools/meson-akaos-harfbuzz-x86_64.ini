[binaries]
c = ['clang', '--target=x86_64-unknown-none-elf']
cpp = ['clang++', '--target=x86_64-unknown-none-elf']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'akaos'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true
