# akaOS Package Manager Configuration
# Default official mirror
mirror=http://mirror.zyqu.pl/akaos

# Required trust anchor: SHA-256 of the exact packages.db.txt snapshot for arch.
# Obtain through an independently authenticated channel, never from this HTTP
# mirror. Updates/installs fail closed until configured. Replace the pin for
# each new repository snapshot. Existing cached metadata is also checked.
# metadata_sha256=<64 hexadecimal characters>

# Architecture will default to the running machine architecture if unset
# arch=x86_64

# Local storage locations
cachedir=/var/cache/pkg
dbdir=/var/lib/pkg
